name: Watch upstream Cline CLI releases

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch-upstream:
    name: Check official Cline CLI tags
    runs-on: ubuntu-latest
    if: github.repository != 'cline/cline'
    steps:
      - name: Checkout downstream
        uses: actions/checkout@v6

      - name: Open one issue for each pending CLI release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs")

            const upstream = { owner: "cline", repo: "cline" }
            const labels = [
              { name: "upstream-update", color: "1d76db", description: "Tracks official upstream Cline releases" },
              { name: "maintenance", color: "fbca04", description: "Repository maintenance task" },
              { name: "cline-sync", color: "5319e7", description: "Downstream Cline sync task" },
            ]

            function parseCliTag(value) {
              const match = String(value || "").match(/^cli-v(\d+)\.(\d+)\.(\d+)$/)
              return match ? match.slice(1).map(Number) : null
            }

            function compareCliTags(left, right) {
              const a = parseCliTag(left)
              const b = parseCliTag(right)
              if (!a || !b) {
                throw new Error(`Cannot compare invalid CLI tags: ${left}, ${right}`)
              }
              for (let index = 0; index < 3; index += 1) {
                if (a[index] !== b[index]) {
                  return a[index] - b[index]
                }
              }
              return 0
            }

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                })
              } catch (error) {
                if (error.status !== 404) {
                  throw error
                }
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                })
              }
            }

            const manifest = JSON.parse(fs.readFileSync("release/port-manifest.json", "utf8"))
            const currentCliTag = manifest?.upstream?.tag
            if (!parseCliTag(currentCliTag)) {
              throw new Error(`release/port-manifest.json contains an invalid upstream CLI tag: ${currentCliTag}`)
            }

            const upstreamTags = await github.paginate(github.rest.repos.listTags, {
              ...upstream,
              per_page: 100,
            })
            const cliTags = [...new Set(
              upstreamTags
                .map((tag) => tag.name)
                .filter((name) => parseCliTag(name)),
            )].sort(compareCliTags)
            const latestCliTag = cliTags.at(-1) || null
            const pendingCliTags = cliTags.filter((tag) => compareCliTags(tag, currentCliTag) > 0)

            core.summary.addRaw("## Upstream Cline CLI watch\n\n")
            core.summary.addRaw(`- Current downstream CLI tag: ${currentCliTag}\n`)
            core.summary.addRaw(`- Latest upstream CLI tag: ${latestCliTag || "not found"}\n`)
            core.summary.addRaw(`- Pending CLI tags: ${pendingCliTags.join(", ") || "none"}\n`)

            if (pendingCliTags.length === 0) {
              core.info("No new upstream CLI release tags detected.")
              return
            }

            for (const label of labels) {
              await ensureLabel(label)
            }

            for (const cliTag of pendingCliTags) {
              const trackingKey = `cline-cli-upstream:${cliTag}`
              const search = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue "${trackingKey}"`,
                per_page: 1,
              })

              if (search.data.total_count > 0) {
                core.info(`Issue already exists for ${trackingKey}.`)
                continue
              }

              const title = `Upstream Cline CLI release available: ${cliTag}`
              const body = [
                "Official Cline has published a stable CLI release ahead of this Termux port.",
                "",
                "## Release",
                `- Current downstream CLI tag: ${currentCliTag}`,
                `- Upstream CLI tag to process: ${cliTag}`,
                "",
                "Every stable CLI tag is tracked independently. Process older pending CLI issues first.",
                "",
                "## Sync checklist",
                `- [ ] Run \`bash release/manage.sh inspect ${cliTag}\` and review the upstream CLI diff.`,
                `- [ ] Run \`bash release/manage.sh candidate ${cliTag}\`.`,
                "- [ ] Complete the manual touch, IME, dialog, transcript-scroll, and provider test on the S25 Ultra.",
                "- [ ] Promote the unchanged candidate release.",
                "- [ ] Install the stable release on the S7+ and complete the second-device check.",
                "",
                `Tracking key: \`${trackingKey}\``,
              ].join("\n")

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: labels.map((label) => label.name),
              })

              core.info(`Opened ${issue.data.html_url}`)
            }
